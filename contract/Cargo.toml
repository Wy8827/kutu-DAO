[package]
name = "kutu-dao-contract"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.near.reproducible_build]
# Pin to NEAR's current cargo-near template image and immutable digest. The
# container command matches cargo-near's documented reproducible build workflow.
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
passed_env = []

[lib]
crate-type = ["cdylib", "rlib"]

[features]
sandbox-tests = ["dep:anyhow", "dep:near-workspaces", "dep:serde_json", "dep:tokio"]

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"
required-features = ["sandbox-tests"]

[dependencies]
borsh = "=1.8.1"
near-sdk = "=5.30.1"
anyhow = { version = "1", optional = true }
near-workspaces = { version = "=0.24.0", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
# NEAR's unit-testing dependency graph builds AWS-LC on Windows. Use the upstream
# reproducible x86-64 NASM objects so contributors do not need to install NASM.
aws-lc-rs = { version = "=1.19.0", features = ["prebuilt-nasm"] }
